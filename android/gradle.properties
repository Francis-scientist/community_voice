org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# BACKEND URL - this is the one line you will most likely need to change.
# It must end with a trailing slash.
#
#   Android emulator ................ http://10.0.2.2:8080/
#       10.0.2.2 is a special address that means "the computer running the
#       emulator". Do NOT use localhost - on the emulator that means the
#       emulator itself.
#
#   Real phone on the same Wi-Fi ..... http://192.168.1.42:8080/
#       Replace 192.168.1.42 with your computer's own Wi-Fi IPv4 address.
#       Find it on Windows with:  ipconfig
#       (look for "IPv4 Address" under your Wi-Fi adapter)
#
# After changing this, rebuild the app so the new value is compiled in.
# ---------------------------------------------------------------------------
API_BASE_URL=http://10.0.2.2:8080/
